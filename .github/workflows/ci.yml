name: ci

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Test
        run: make test
      - name: Lint
        run: make lint
      - name: Smoke one-command pipeline
        run: BENIGN_N=8 EXPERIMENT_REQUESTS=4 make all
